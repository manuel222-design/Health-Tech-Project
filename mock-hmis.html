<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock HMIS</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 18px 24px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 24px;
      align-items: start;
    }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
    }

    iframe {
      width: 100%;
      height: 560px;
      border: 0;
      border-radius: 16px;
      background: white;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.10);
    }
  </style>
</head>

<body>

<header>
  <strong>Taifa Care HMIS</strong>
  <span style="margin-left:12px;opacity:.65;">
    Mock Clinical Workspace
  </span>
</header>

<main>

  <div class="layout">

    <section class="card">
      <h2>Patient Consultation</h2>

      <p>
        Patient: Demo Patient
      </p>

      <p>
        This represents a separate HMIS screen.
        The Knowledge Assistant is embedded alongside
        the clinical workflow.
      </p>

      <hr>

      <p>
        <strong>Current task:</strong>
        Book a follow-up appointment.
      </p>
    </section>

    <section>
      <iframe
        src="http://localhost/widget"
        title="Taifa Care Knowledge Assistant"
        loading="lazy"
      ></iframe>
    </section>

  </div>

</main>

</body>
</html>
