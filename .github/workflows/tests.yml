name: Backend Tests

on:
  push:
    branches: [develop, main, staging]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthtech_kb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt

      - name: Set up test database
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthtech_kb_test
        run: |
          python -c "from database import engine, Base; import models; Base.metadata.create_all(bind=engine)"

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthtech_kb_test
          JWT_SECRET_KEY: test-secret-key-for-ci
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python seed.py
          pytest test_main.py -v

